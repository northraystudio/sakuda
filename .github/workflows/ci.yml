# Generated by maruda harness. Adjust working-directory per job for monorepos.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # No branches filter: a PR must be verified whatever its base, so stacked
    # and batched work cannot slip through on a base type nobody enumerated
    # (chore/**, docs/** …). Branch naming is <type>/<issue>-<summary> and the
    # set of types is open — see .claude/rules/maruda-cycle.md.
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.vue'
      - 'package.json'
      - '.github/workflows/ci.yml'
  # Direct pushes to the default / integration branch are scanned too
  # (bypass coverage). Feature and epic branches are covered via pull_request.
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.vue'
      - 'package.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  node:
    name: Node (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Preflight before install: strict by design (shift-left), but fail with
      # an actionable message instead of a raw "missing script" error. The
      # manifest is parsed directly — package-manager stderr is version-fragile.
      - name: Validate required package scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (!fs.existsSync('package.json')) {
            console.error('::error file=package.json,title=Missing package.json::Create package.json with the required scripts before the first code PR.');
            process.exit(1);
          }
          let pkg;
          try { pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); }
          catch (e) {
            console.error('::error file=package.json,title=Invalid package.json::package.json is not valid JSON.');
            process.exit(1);
          }
          const required = ['lint', 'typecheck', 'test'];
          let failed = false;
          for (const name of required) {
            const v = (pkg.scripts || {})[name];
            if (typeof v !== 'string' || v.trim() === '') {
              console.error('::error file=package.json,title=Missing npm script::Add scripts.' + name + ' to package.json before the first code PR.');
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test

